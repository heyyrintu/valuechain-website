# Serves the static build from scripts/build.mjs.
#
# Every page is written as <route>/index.html. `try_files $uri $uri/` lets nginx
# serve those and issue its own 301 from /about to /about/, matching the
# canonical URLs.

# ── This block must stay the default server. ──
#
# `server_name _;` is NOT a wildcard. `_` is simply a name that can never match
# a real Host header. A block catches unmatched requests only by being the
# *default server* for its listen address, and nginx assigns that role to the
# first block declared for the address unless one is explicitly marked
# `default_server`.
#
# Relying on declaration order broke production once: the www redirect (now at
# the bottom of this file) was declared above this block, silently became the
# default server, and answered every request whose Host was not
# www.dronavaluechain.com — including the container healthcheck on 127.0.0.1 and
# all apex traffic — with a 301. `default_server` pins the fallback here no
# matter what is added above it later.
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Don't leak the nginx version.
    server_tokens off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml image/svg+xml
                      font/woff font/woff2;

    # CSS: stable filename, so cache but revalidate after a deploy.
    location /assets/css/ {
        expires 1d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    # Images and fonts: long but not immutable, since filenames are stable.
    location ~* \.(?:png|jpe?g|gif|svg|ico|webp|avif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    # Crawler-facing files. Set the Content-Type explicitly so llms.txt and the
    # manifest are never served with the wrong type.
    location = /robots.txt       { default_type text/plain; charset utf-8; }
    location = /sitemap.xml      { default_type application/xml; charset utf-8; }
    location = /llms.txt         { default_type text/plain; charset utf-8; }
    location = /llms-full.txt    { default_type text/plain; charset utf-8; }
    location = /site.webmanifest { default_type application/manifest+json; charset utf-8; }

    # Old website URLs. Permanent redirects pass their ranking to the closest
    # page on the new site instead of leaving 404s in search results.
    location ~ ^/services/(in-plant-services|manpower-supply)/?$ {
        return 301 /services/in-plant-logistics/;
    }
    location ~ ^/services/(inventory-management|packaging-solutions)/?$ {
        return 301 /services/warehousing/;
    }
    location ~ ^/services/last-mile-delivery/?$ {
        return 301 /services/transportation/;
    }
    location ~ ^/industries/(pharmaceutical|automotive|fmcg-retail)/?$ {
        return 301 /industries/;
    }
    location ~ ^/(blog|clients)(/.*)?$ {
        return 301 /;
    }
    location ~ ^/(about|services|industries|technology|contact)\.html$ {
        return 301 /$1/;
    }
    location ~ ^/(warehousing|in-plant-logistics|transportation|3pl|4pl|aftermarket-logistics)\.html$ {
        return 301 /services/$1/;
    }

    # Pages. Headers are set here rather than at server level because an
    # add_header in any location replaces inherited ones outright.
    location / {
        try_files $uri $uri/ =404;

        add_header Cache-Control            "no-cache" always;
        add_header X-Content-Type-Options   "nosniff" always;
        add_header X-Frame-Options          "SAMEORIGIN" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }
}

# Canonical host is the apex, dronavaluechain.com. Requests arriving on the www
# hostname are redirected once, permanently, so a page is never reachable at two
# addresses — the duplicate-content case <link rel="canonical"> resolves as a
# hint, and resolving it at the HTTP layer is stronger.
#
# 301 (not 302): the move is permanent, and only a permanent redirect transfers
# ranking signals to the target.
#
# Deliberately declared LAST and without `default_server`, so it can only ever
# match an explicit www Host. It must never become the catch-all — see the note
# on the site block above.
#
# Note this assumes TLS terminates upstream (proxy/load balancer) and that the
# original Host is forwarded. If the Host is rewritten upstream this block
# simply never matches, which is harmless.
server {
    listen      80;
    listen      [::]:80;
    server_name www.dronavaluechain.com;
    return 301  https://dronavaluechain.com$request_uri;
}

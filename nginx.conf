# Serves the Next.js static export (output: 'export', trailingSlash: true).
#
# Because next.config.mjs sets trailingSlash, every page is exported as
# <route>/index.html. `try_files $uri $uri/` lets nginx serve those and issue
# its own 301 from /about to /about/, matching Next's canonical URLs.

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Don't leak the nginx version.
    server_tokens off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml image/svg+xml
                      font/woff font/woff2;

    # Hashed build assets never change under a given name — cache hard.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # Images and fonts: long but not immutable, since filenames are stable.
    location ~* \.(?:png|jpe?g|gif|svg|ico|webp|avif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    # Pages. Headers are set here rather than at server level because an
    # add_header in any location replaces inherited ones outright.
    location / {
        try_files $uri $uri/ =404;

        add_header Cache-Control            "no-cache" always;
        add_header X-Content-Type-Options   "nosniff" always;
        add_header X-Frame-Options          "SAMEORIGIN" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }
}
